[project]
name = "bettory-backend"
version = "0.1.0"
description = "BETTORY - Football Match Verification Engine (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.1",
    "scipy>=1.14",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Architecture R3: the calculation and decision packages are pure.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Calculation is pure: imports only domain"
type = "forbidden"
source_modules = ["app.calculation", "app.decision"]
forbidden_modules = [
    "app.storage",
    "app.ingestion",
    "app.normalisation",
    "app.api",
    "app.jobs",
    "app.notifications",
    "app.settlement",
    "app.backtest",
    "httpx",
    "sqlalchemy",
    "psycopg",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "app.api | app.jobs | app.backtest",
    "app.settlement | app.notifications",
    "app.decision",
    "app.calculation",
    "app.domain",
]
