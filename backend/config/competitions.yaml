# BETTORY competition registry — the ONLY competitions the pipeline stores.
# Each entry maps BETTORY's code to every source's own key for that competition.
#
# season_format: SPLIT (Aug–May, label "2025-26") or CALENDAR (label "2025")
# team_sources:  sources allowed to CREATE new teams for this competition. Every other source
#                must match existing teams (provider id / alias) or goes to the review queue.
# API-Football league ids: verify with /leagues before relying on them (Phase 0 checked 39 only).

competitions:
  - code: ENG1
    name: Premier League
    country: England
    type: LEAGUE
    level: 1
    timezone: Europe/London
    season_format: SPLIT
    team_sources: [FOOTBALL_DATA_ORG, OPENFOOTBALL, API_FOOTBALL]
    providers:
      API_FOOTBALL: "39"
      FOOTBALL_DATA_ORG: PL
      OPENFOOTBALL: en.1
      FOOTBALL_DATA_CO_UK: E0

