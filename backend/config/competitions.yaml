# BETTORY competition registry — the ONLY competitions the pipeline stores.
# Each entry maps BETTORY's code to every source's own key for that competition.
#
# season_format: SPLIT (Aug–May, label "2025-26") or CALENDAR (label "2025")
# team_sources:  sources allowed to CREATE new teams for this competition. Every other source
#                must match existing teams (provider id / alias) or goes to the review queue.
# fifteen_minute_market: your bookmaker offers the 15' markets (0-15 Draw, 0-15 Under 0.5) for this competition.
#                Layer 0 skips every fixture of a competition set to false ("no market, no bet").
#                Initial values are ASSUMED true for these major leagues - confirm with your bookmaker.
# API-Football league ids: verify with /leagues before relying on them (Phase 0 checked 39 only).
# ESPN: league code of ESPN's public feeds (docs/ESPN.md) - the goal-minute source without a key or daily quota.
#       Every code below was checked on 2026-11-23 (matches with complete goal minutes returned).
# API-Football ids of the competitions added 2026-11-23 were checked against its /leagues list that day.
# fifteen_minute_market: true for all 50 competitions - owner decision 2026-11-23 (the bookmaker offers the 15'
# markets in every registered league). Set a league to false if that turns out not to be so: Layer 0 then skips it.

competitions:
  - code: ENG1
    name: Premier League
    country: England
    type: LEAGUE
    level: 1
    timezone: Europe/London
    season_format: SPLIT
    fifteen_minute_market: true
    team_sources: [FOOTBALL_DATA_ORG, OPENFOOTBALL, API_FOOTBALL, ESPN]
    providers:
      API_FOOTBALL: "39"
      FOOTBALL_DATA_ORG: PL
      OPENFOOTBALL: en.1
      FOOTBALL_DATA_CO_UK: E0
