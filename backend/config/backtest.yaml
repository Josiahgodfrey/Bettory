# BETTORY backtest settings (DEVELOPMENT-PLAN.md Phase 4 / Gate B, DATA-SOURCES-AND-MARKET-MODEL.md 9).
# These decide how results are JUDGED, never how a fixture is priced: model parameters live only in
# config/params_v*.yaml. Loaded and validated by app/backtest/config.py (unknown or missing keys are rejected).

calibration:
  bucket_width_pts: 2          # 70-72 %, 72-74 % ... (pricing doc 15)
  tolerance_pts: 3             # Gate B: |actual - predicted| <= max(tolerance_pts, noise_multiplier x SE)
  noise_multiplier: 2          # in each populated bucket; SE = binomial standard error of the bucket's actual
                               # rate. Owner decision 2026-11-16: a flat 3 pts is tighter than the noise
                               # below ~900 fixtures per bucket (a perfect model would fail it by chance)
  min_bucket_matches: 50       # "populated": fewer predictions are shown but not judged (at n = 50 and
                               # p = 0.73 the standard error alone is 6.3 pts)

gate_b:
  min_qualified: 300           # qualified historical selections

uncertainty:                   # confidence intervals (docs/RESEARCH-PHASE4-TUNING.md 3.4, 6)
  bootstrap_samples: 2000      # resamples of whole SESSIONS (matches in one session are not independent)
  confidence: 0.95
  seed: 20261116               # fixed: the same run always gives the same intervals
  min_sessions: 30             # fewer sessions: the interval is shown but marked unreliable (a bootstrap over a
                               # handful of blocks is far too narrow)

estimated_value:
  assumed_bookmaker_margin: 0.07   # bookmaker 15' price = Model C fair odds x (1 - margin), data doc 9
  stake: 1.0
