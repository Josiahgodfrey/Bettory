# BETTORY pre-registered tuning plan, version 1 (docs/RESEARCH-PHASE4-TUNING.md §2.3 and §8).
# Decided by the owner on 2026-11-16, BEFORE the tuning seasons are loaded and before any tuning run.
#
# Rules:
#   - Never edit this file after a real run has used it. The run records its SHA-256 in config/tuning_lock.yaml
#     and the tool refuses a changed file. A new plan is a new file (tuning_v2.yaml), and the report lists both.
#   - Every variation is reported, the selection rule is the one below, and the holdout is evaluated ONCE.
#   - Loaded and validated by app/backtest/tuning_plan.py (unknown keys, invalid parameter values, overlapping
#     periods and a grid that does not contain the base parameters are rejected).

plan_version: 1
registered_on: "2026-11-16"
base_params: "1.5"                       # config/params_v1.5.yaml: the current parameters (must be in the grid)
competitions: [ENG1, GER1, AUT1]

periods:                                 # session dates (EAT)
  tuning:  { first: "2022-08-01", last: "2025-06-30" }   # 2022-23, 2023-24, 2024-25: variations compared here
  holdout: { first: "2025-07-01", last: "2026-06-30" }   # 2025-26: touched once, by the selected variation and the base

selection:
  market: UNDER05                        # P(Under 0.5 at 15') of every priced fixture with a known result
  metric: log_loss                       # lower is better (research §3.2); never ROI
  tie_tolerance: 0.0005                  # variations within this of the best count as tied: the one with the
                                         # fewest changes from the base wins, then the earliest in grid order

grid:                                    # every combination of one option per dimension is one variation
  - name: rating_shrinkage               # prior matches pulling team ratings toward the league (FT : HT = 1 : 1.5)
    options:
      - { label: "m20",  set: { model_a.rating_prior_matches: { FT: 20,  HT: 30 } } }    # base
      - { label: "m40",  set: { model_a.rating_prior_matches: { FT: 40,  HT: 60 } } }
      - { label: "m80",  set: { model_a.rating_prior_matches: { FT: 80,  HT: 120 } } }
      - { label: "m160", set: { model_a.rating_prior_matches: { FT: 160, HT: 240 } } }
  - name: early_goal_index_trust         # Model B v2 index factor I = index ^ w_I (0 = ignore early-goal form)
    options:
      - { label: "wI0",    set: { shrinkage.early_index_trust_w_I: 0.0 } }
      - { label: "wI0.25", set: { shrinkage.early_index_trust_w_I: 0.25 } }
      - { label: "wI0.5",  set: { shrinkage.early_index_trust_w_I: 0.5 } }                # base
  - name: team_vs_market                 # mu blend where Model C exists; without main-market odds every option
    options:                             # prices identically and the dimension is reported as NOT TESTABLE
      - { label: "team1.0",  set: { blend.team_weight: 1.0,  blend.market_weight: 0.0 } }
      - { label: "team0.5",  set: { blend.team_weight: 0.5,  blend.market_weight: 0.5 } }  # base
      - { label: "team0.25", set: { blend.team_weight: 0.25, blend.market_weight: 0.75 } }

# Not in this plan (candidates for a later, separately registered plan): recalibration of P toward the league
# level, exponential time decay of team history, the 1-1 state-dependence delta, the EV threshold and grades.

hypotheses:                              # written down in BACKTEST-REPORT §2.5 after the first run; tested on
  - id: H1_GRADE_B                       # the tuning seasons with the base parameters, and on the holdout
    statement: "Listed Grade B fixtures go 0-0 at 15' less often than predicted"
    subset: { listed: true, grade: B }
    action_if_confirmed: "Grade B is no longer listed in reports (owner decision 2026-11-16)"
  - id: H2_TOP_PREDICTIONS
    statement: "Fixtures priced P(Under 0.5) >= 0.76 are over-confident"
    subset: { listed: false, p_under05_at_least: 0.76 }
    action_if_confirmed: "candidate for a later plan (recalibration or a cap on P); no change in this plan"
  # "confirmed" = the 95 % interval (sessions resampled) of (actual - predicted) lies entirely below 0

gate_b:                                  # evaluated on the HOLDOUT with the selected variation (owner decisions 2026-11-16)
  min_qualified: 300                     # listed selections with a known result
  calibration: noise_aware               # config/backtest.yaml calibration rules: |gap| <= max(3 pts, 2 x SE)
  beats_baseline: paired_interval        # Brier difference vs competition-only: upper end of the 95 % interval < 0
  profit: paper_betting                  # no historical profit criterion; ROI at the minimum odds is reported with
                                         # its interval as a consistency check, profit is proven in paper betting
