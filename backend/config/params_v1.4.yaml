# BETTORY calculation parameters — params_version 1.4
# Starting values from the docs. ALL values are to be calibrated by the backtest (Phase 4).
# Any change → copy this file to a new version; never edit a version that has produced results.

params_version: "1.4"
formula_version: "v1.4"

sessions:
  timezone: "Africa/Nairobi"          # EAT, UTC+3, no DST
  night: { start: "01:00", end: "12:59", deadline: "01:00" }
  noon:  { start: "13:00", end: "00:59", deadline: "13:00" }
  lead_time_hours: 2                  # ready_by = min(deadline, first_ko - 2h)
  run_buffer_minutes: 45
  max_matches_per_session: 50         # maximum, never a target

data_gate:
  history_matches: 10
  min_complete_per_view: 8

blend:
  venue_weight: 0.6
  general_weight: 0.4
  team_weight: 0.5                    # mu level (pricing doc 4)
  market_weight: 0.5                  # 0 when no market odds

shrinkage:
  early_share_K_goals: 300            # pricing doc 5.2
  team_index_k: 3                     # data doc 16.3
  early_index_trust_w_I: 0.5          # pricing doc 6

competition_baselines:
  min_matches: 50
  max_pooled_seasons: 3
  share_review_low: 0.09
  share_review_high: 0.16

model_c:
  max_line_disagreement: 0.20
  devig_method: "POWER"

value:
  ev_min: 0.05
  ev_min_no_market: 0.08              # proposed stricter threshold without market check
  max_model_gap_pts: 10
  max_bookmaker_gap_pts: 10
  overround_max: 0.15

grades:
  a_max_gap_pts: 5
  b_max_gap_pts: 10

red_flags:
  favourite_odds_below: 1.50
  favourite_proxy_home_win_rate: 0.70
  favourite_proxy_away_win_rate: 0.20
  recent_early_goals_last5: 3
  h2h_min_meetings: 4
  h2h_early_goal_rate: 0.50

state_dependence:
  delta: 0.0

settlement:
  cutoff_label_minute: 15             # provider label "15'" = 14:00–14:59 → inside 0–15
